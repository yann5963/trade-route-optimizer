<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">MTG Collection Optimizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .htmx-indicator{
            display:none;
        }
        .htmx-request .htmx-indicator{
            display:inline;
        }
        .htmx-request.htmx-indicator{
            display:inline;
        }
    </style>
</head>
<body class="bg-slate-900 text-gray-200 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-800 border-r border-slate-700 flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <i data-lucide="library" class="text-indigo-500 mr-3"></i>
            <span class="font-bold text-lg tracking-wide text-white" th:text="#{app.title}">MTG Copilot</span>
        </div>
        <nav class="flex-1 py-6 px-4 space-y-2">
            <a href="/ui/collection" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg hover:bg-slate-700 hover:text-white transition-colors">
                <i data-lucide="book-open" class="mr-3 w-5 h-5"></i>
                <span th:text="#{sidebar.collection}">Ma Collection</span>
            </a>
            <a href="#" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-gray-400 hover:bg-slate-700 hover:text-white transition-colors">
                <i data-lucide="star" class="mr-3 w-5 h-5"></i>
                <span th:text="#{sidebar.wishlist}">Wishlist</span>
            </a>
            <a href="/ui/market" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-gray-400 hover:bg-slate-700 hover:text-white transition-colors">
                <i data-lucide="trending-up" class="mr-3 w-5 h-5"></i>
                <span th:text="#{sidebar.market}">Market Tracking</span>
            </a>
            <a href="/ui/deals" class="flex items-center justify-between px-4 py-3 text-sm font-medium rounded-lg text-gray-400 hover:bg-slate-700 hover:text-white transition-colors relative">
                <div class="flex items-center">
                    <i data-lucide="zap" class="mr-3 w-5 h-5"></i>
                    <span th:text="#{deals.title}">Opportunités</span>
                </div>
                <!-- HTMX Polling for new deals count -->
                <span hx-get="/ui/deals/count" hx-trigger="load, every 5m" id="deals-badge">
                    <!-- Badge will be injected here if count > 0 -->
                </span>
            </a>
            <a href="/ui/settings" class="flex items-center px-4 py-3 text-sm font-medium rounded-lg text-gray-400 hover:bg-slate-700 hover:text-white transition-colors">
                <i data-lucide="settings" class="mr-3 w-5 h-5"></i>
                <span th:text="#{sidebar.settings}">Paramètres</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">

        <!-- Command Zone (Header) -->
        <header class="h-16 bg-slate-800 border-b border-slate-700 flex items-center justify-center px-8 relative">
            <div class="w-full max-w-2xl relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="bot" class="h-5 w-5 text-indigo-400"></i>
                </div>
                <!-- HTMX Form for AI command -->
                <form hx-post="/api/ai/ask" hx-target="#ai-results" hx-indicator="#loading-indicator">
                    <input type="text" name="query" th:placeholder="#{search.placeholder}"
                           class="block w-full pl-10 pr-3 py-2 border border-slate-600 rounded-md leading-5 bg-slate-700 text-gray-300 placeholder-gray-400 focus:outline-none focus:bg-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 sm:text-sm transition-colors">
                </form>
                <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-xs text-gray-500 font-semibold" th:text="#{cmd.shortcut}">
                    Cmd+K
                </div>
            </div>

            <div id="loading-indicator" class="htmx-indicator absolute right-8 text-indigo-400">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
            </div>
        </header>

        <!-- AI Results Modal / Container -->
        <div id="ai-results" class="empty:hidden bg-slate-800 border-b border-indigo-500/30 p-4 shadow-lg text-sm text-gray-300">
            <!-- AI Response will be injected here -->
        </div>

        <!-- Dynamic Content -->
        <main class="flex-1 overflow-y-auto p-8 bg-slate-900" th:insert="${content}">
            <!-- Page specific content will be injected here -->
        </main>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
