<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base :: layout(~{::div.content})}">
<head>
    <title th:text="#{collection.title}">Ma Collection</title>
</head>
<body>
    <div class="content w-full max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-white" th:text="#{collection.title}">Ma Collection</h1>
            <button hx-get="/ui/collection/add" 
                    hx-target="#modal-container"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md font-medium text-sm transition-colors flex items-center">
                <i data-lucide="plus" class="w-4 h-4 mr-2"></i>
                <span th:text="#{collection.add}">Ajouter</span>
            </button>
        </div>

        <!-- Filter Input -->
        <div class="mb-6">
            <div class="relative max-w-md">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i data-lucide="search" class="h-4 w-4 text-gray-400"></i>
                </div>
                <input type="text" name="filter" th:placeholder="#{collection.filter}"
                       hx-get="/ui/collection/filter"
                       hx-trigger="keyup changed delay:300ms"
                       hx-target="#collection-table-body"
                       class="block w-full pl-10 pr-3 py-2 border border-slate-700 rounded-md leading-5 bg-slate-800 text-gray-300 placeholder-gray-500 focus:outline-none focus:bg-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 sm:text-sm transition-colors">
            </div>
        </div>

        <!-- Cards Table -->
        <div class="bg-slate-800 shadow rounded-lg overflow-hidden border border-slate-700">
            <table class="min-w-full divide-y divide-slate-700">
                <thead class="bg-slate-900/50">
                    <tr>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.card}">Carte</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.set}">Édition</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.condition}">État</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.language}">Langue</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.foil}">Foil</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.quantity}">Quantité</th>
                        <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider" th:text="#{table.purchasePrice}">Prix d'Achat</th>
                    </tr>
                </thead>
                <tbody id="collection-table-body" class="bg-slate-800 divide-y divide-slate-700">
                    <!-- Default Fragment for HTMX update -->
                    <tr th:fragment="cardRows" th:each="userCard : ${userCards}" class="hover:bg-slate-700/50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="flex items-center">
                                <div class="flex-shrink-0 h-10 w-10 bg-slate-700 rounded-md flex items-center justify-center overflow-hidden border border-slate-600">
                                    <!-- Placeholder image or Scryfall logic could go here -->
                                    <i data-lucide="image" class="w-5 h-5 text-gray-500"></i>
                                </div>
                                <div class="ml-4">
                                    <div class="text-sm font-medium text-white" th:text="${userCard.card.name}">Sol Ring</div>
                                    <div class="text-xs text-indigo-400" th:text="${userCard.card.rarity}">Uncommon</div>
                                </div>
                            </div>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300" th:text="${userCard.card.setName}">Commander 2021</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-900/50 text-green-400 border border-green-800" th:text="${userCard.condition}">NM</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300" th:text="${userCard.language}">EN</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300">
                            <i th:if="${userCard.isFoil}" data-lucide="sparkles" class="w-4 h-4 text-yellow-500"></i>
                            <span th:unless="${userCard.isFoil}">-</span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300 font-medium" th:text="${userCard.quantity}">1</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-300" th:text="${userCard.purchasePrice != null ? userCard.purchasePrice + ' €' : '-'}">-</td>
                    </tr>

                    <tr th:if="${userCards == null or userCards.isEmpty()}">
                        <td colspan="7" class="px-6 py-8 text-center text-gray-500 text-sm">
                            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-3 opacity-50"></i>
                            <span th:text="#{table.empty}">Votre collection est vide.</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Live Deals Section via HTMX Polling -->
        <div hx-get="/ui/deals/fragment" hx-trigger="load">
            <!-- Content will be swapped here -->
        </div>

    </div>
</body>
</html>
