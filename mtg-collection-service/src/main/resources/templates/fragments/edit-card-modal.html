<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="edit-card-form" id="modal-backdrop" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white">Modifier la carte</h2>
                <button onclick="document.getElementById('modal-backdrop').remove()" class="text-gray-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form th:hx-post="'/ui/collection/edit/' + ${userCard.id}" 
                  hx-target="#collection-table-container" 
                  hx-on::after-request="if(event.detail.successful && event.detail.elt === this) document.getElementById('modal-backdrop').remove()" 
                  class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Carte</label>
                    <div class="w-full bg-slate-900 border border-slate-700 rounded-md px-3 py-2 text-gray-400 italic" th:text="${userCard.card.name + ' (' + userCard.card.setName + ')'}"></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.condition}">État</label>
                        <select name="condition" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                            <option value="NM" th:selected="${userCard.condition == 'NM'}">Near Mint (NM)</option>
                            <option value="EX" th:selected="${userCard.condition == 'EX'}">Excellent (EX)</option>
                            <option value="GD" th:selected="${userCard.condition == 'GD'}">Good (GD)</option>
                            <option value="LP" th:selected="${userCard.condition == 'LP'}">Light Played (LP)</option>
                            <option value="PL" th:selected="${userCard.condition == 'PL'}">Played (PL)</option>
                            <option value="PO" th:selected="${userCard.condition == 'PO'}">Poor (PO)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.language}">Langue</label>
                        <select name="language" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                            <option value="FR" th:selected="${userCard.language == 'FR'}">Français</option>
                            <option value="EN" th:selected="${userCard.language == 'EN'}">English</option>
                            <option value="DE" th:selected="${userCard.language == 'DE'}">Deutsch</option>
                            <option value="IT" th:selected="${userCard.language == 'IT'}">Italiano</option>
                            <option value="ES" th:selected="${userCard.language == 'ES'}">Español</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.quantity}">Quantité</label>
                        <input type="number" name="quantity" th:value="${userCard.quantity}" min="1" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.purchase_price}">Prix d'achat (€)</label>
                        <input type="number" step="0.01" name="purchasePrice" th:value="${userCard.purchasePrice}" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" name="isFoil" id="isFoilEdit" th:checked="${userCard.isFoil}" class="w-4 h-4 text-indigo-600 bg-slate-700 border-slate-600 rounded focus:ring-indigo-500">
                    <label for="isFoilEdit" class="ml-2 text-sm font-medium text-gray-400" th:text="#{collection.add.is_foil}">Foil</label>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="document.getElementById('modal-backdrop').remove()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-md transition-colors" th:text="#{collection.add.cancel}">Annuler</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md transition-colors">Enregistrer</button>
                </div>
            </form>
            <script>lucide.createIcons();</script>
        </div>
    </div>
</body>
</html>
