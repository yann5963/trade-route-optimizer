<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="add-wishlist-form" id="modal-backdrop" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-in fade-in zoom-in duration-200">
            <div class="p-6 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-xl font-bold text-white" th:text="#{sidebar.wishlist}">Wishlist</h2>
                <button onclick="document.getElementById('modal-backdrop').remove()" class="text-gray-400 hover:text-white transition-colors">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <form hx-post="/ui/wishlist/add" hx-target="#wishlist-table-container" hx-on::after-request="if(event.detail.successful && event.detail.elt === this) document.getElementById('modal-backdrop').remove()" class="p-6 space-y-4">
                <!-- Champ caché pour le code d'édition réel envoyé au serveur -->
                <input type="hidden" id="setCodeHiddenWish" name="setName">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.set_name}">Édition</label>
                    <input type="text" id="setNameDisplayWish" required list="setsListWish"
                           placeholder="Tapez le nom ou code de l'édition..."
                           class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    <datalist id="setsListWish">
                        <option th:each="set : ${mtgSets}" th:attr="data-code=${set.code}" th:value="${set.name}"></option>
                    </datalist>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.card_name}">Nom de la carte</label>
                    <input type="text" id="cardNameInputWish" name="name" required disabled list="cardSuggestionsWish"
                           hx-get="/api/collection/reference/cards"
                           hx-trigger="keyup changed delay:300ms, loadCards"
                           hx-target="#cardSuggestionsWish"
                           hx-swap="innerHTML"
                           hx-include="#setCodeHiddenWish"
                           class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    <datalist id="cardSuggestionsWish">
                        <!-- Options will be loaded via HTMX -->
                    </datalist>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.condition}">État</label>
                        <select name="condition" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                            <option value="NM">Near Mint (NM)</option>
                            <option value="EX">Excellent (EX)</option>
                            <option value="GD">Good (GD)</option>
                            <option value="LP">Light Played (LP)</option>
                            <option value="PL">Played (PL)</option>
                            <option value="PO">Poor (PO)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.language}">Langue</label>
                        <select name="language" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                            <option value="FR">Français</option>
                            <option value="EN">English</option>
                            <option value="DE">Deutsch</option>
                            <option value="IT">Italiano</option>
                            <option value="ES">Español</option>
                        </select>
                    </div>
                </div>
                <input type="hidden" name="rarity" value="Common">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" th:text="#{collection.add.quantity}">Quantité</label>
                        <input type="number" name="quantity" value="1" min="1" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Prix Max (€)</label>
                        <input type="number" step="0.01" name="maxPrice" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Prix Moyen Marché (€)</label>
                        <input type="number" step="0.01" name="marketPrice" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Date du Relevé</label>
                        <input type="date" name="marketPriceDate" th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}" class="w-full bg-slate-700 border border-slate-600 rounded-md px-3 py-2 text-white focus:outline-none focus:border-indigo-500 transition-colors">
                    </div>
                </div>
                <div class="flex items-center">
                    <input type="checkbox" name="isFoil" id="isFoil" class="w-4 h-4 text-indigo-600 bg-slate-700 border-slate-600 rounded focus:ring-indigo-500">
                    <label for="isFoil" class="ml-2 text-sm font-medium text-gray-400" th:text="#{collection.add.is_foil}">Foil</label>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="document.getElementById('modal-backdrop').remove()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-medium py-2 rounded-md transition-colors" th:text="#{collection.add.cancel}">Annuler</button>
                    <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-md transition-colors" th:text="#{collection.add.submit}">Ajouter</button>
                </div>
            </form>
            <script>
                lucide.createIcons();

                (function() {
                    var displayInput = document.getElementById('setNameDisplayWish');
                    var codeInput    = document.getElementById('setCodeHiddenWish');
                    var cardInput    = document.getElementById('cardNameInputWish');
                    var datalist     = document.getElementById('setsListWish');

                    // Build a map: setName (lowercase) -> setCode
                    var setMap = {};
                    Array.from(datalist.options).forEach(function(opt) {
                        setMap[opt.value.toLowerCase()] = opt.getAttribute('data-code');
                    });

                    function onSetInputChange() {
                        var typed = displayInput.value.trim();
                        var code  = setMap[typed.toLowerCase()];
                        if (code) {
                            // Valid set selected: update hidden field and enable card input
                            codeInput.value  = code;
                            cardInput.disabled = false;
                            htmx.trigger(cardInput, 'loadCards');
                        } else {
                            // Not yet a valid set
                            codeInput.value  = '';
                            cardInput.disabled = true;
                        }
                    }

                    displayInput.addEventListener('input', onSetInputChange);
                    displayInput.addEventListener('change', onSetInputChange);
                })();
            </script>
        </div>
    </div>
</body>
</html>
